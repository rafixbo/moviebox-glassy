name: moviebox_glassy
description: "MovieBox Glassy — a smooth, glassy, compact movie & TV streaming client for Android and Windows, powered by the MovieBox API (via mesamirh/MovieBox-Tui)."
publish_to: 'none'
version: 1.0.5+6

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  crypto: ^3.0.6
  cached_network_image: ^3.4.1
  shared_preferences: ^2.3.3
  media_kit: ^1.2.0
  media_kit_video: ^1.2.0
  media_kit_libs_video: ^1.0.5
  url_launcher: ^6.3.1
  dio: ^5.7.0
  path_provider: ^2.1.5
  screen_brightness: ^2.1.3
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
